<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="author" content="Kirya Nazir" />
		<meta
			name="description"
			content="Contact MVSC: send questions, feedback, or comments using the form. You can include your email for a reply."
		/>
		<meta name="keywords" content="contact,form,feedback,questions,email" />
		<title>MVSC - Contact</title>

		<link rel="icon" href="img/favicon.png" />
		<link rel="stylesheet" type="text/css" href="css/style.css" />

		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Source+Code+Pro:ital,wght@0,200..900;1,200..900&display=swap"
			rel="stylesheet"
		/>
	</head>

	<body>
		<figure class="hero hero-small">
			<img
				src="img/contact-hero.png"
				alt="Warm lights and window grid background"
				title="Contact page header image"
			/>
			<figcaption class="sr-only">Contact page header image.</figcaption>
		</figure>

		<header class="site-header">
			<nav class="nav-wrap" aria-label="Primary navigation">
				<a class="brand" href="home.html" aria-label="Go to homepage">
					<span class="brand-logo" aria-hidden="true"></span>
				</a>

				<ul class="nav-list">
					<li><a class="nav-link" href="intro.html">Intro</a></li>
					<li><a class="nav-link" href="setup.html">Set up</a></li>
					<li><a class="nav-link" href="basics.html">Basics</a></li>
					<li><a class="nav-link" href="demo.html">Demo</a></li>
					<li>
						<a class="nav-link nav-current" href="Contact.html">Contact</a>
					</li>
				</ul>
			</nav>
		</header>

		<main class="page">
			<section class="card">
				<h1>Contact Form</h1>
				<p>
					Through the form below you can contact me if you have questions,
					feedback, or comments about the website!
				</p>

				<section class="form-wrap">
					<form action="Contact.html" method="get" class="contact-form">
						<fieldset>
							<legend>Send a message</legend>

							<section class="field-row">
								<span class="label">Title</span>
								<label class="radio">
									<input type="radio" name="title" value="mr" />
									Mr.
								</label>
								<label class="radio">
									<input type="radio" name="title" value="ms" />
									Ms.
								</label>
								<label class="radio">
									<input type="radio" name="title" value="mx" />
									Mx.
								</label>
							</section>

							<section class="field">
								<label for="name">Name</label>
								<input
									id="name"
									name="name"
									type="text"
									placeholder="John Smith"
								/>
							</section>

							<section class="field">
								<label for="email">Email</label>
								<input
									id="email"
									name="email"
									type="email"
									placeholder="example@email.com"
								/>
							</section>

							<section class="field">
								<label for="phone">Phone</label>
								<input
									id="phone"
									name="phone"
									type="tel"
									placeholder="+31 60123456"
								/>
							</section>

							<section class="field">
								<label for="comment">Comment</label>
								<textarea
									id="comment"
									name="comment"
									rows="6"
									placeholder="Input"
								></textarea>
							</section>

							<section class="form-actions">
								<input class="cta" type="submit" value="Send" />
							</section>
						</fieldset>
					</form>
				</section>

				<p class="thanks">Thank you for your comment&reg;!</p>
			</section>
		</main>

		<footer class="site-footer">
			<p class="footer-copy">&copy; 2026 Kirya Salyik</p>
		</footer>
	</body>
</html>
